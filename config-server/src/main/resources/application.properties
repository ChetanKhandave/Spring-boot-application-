spring.application.name=config-server
server.port=8762
spring.profiles.active=native
# Run from the repository root, or supply an absolute CONFIG_LOCATION file URI.
spring.cloud.config.server.native.search-locations=${CONFIG_LOCATION:file:./configurations/}

# Config Server boots independently, so its observability settings are local.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${spring.application.name}:${server.port}
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.file.name=${LOG_DIRECTORY:./logs}/${spring.application.name}-${server.port}.log
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.instance=${spring.application.name}:${server.port}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
