global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8762"]
        labels:
          service: config-server
      - targets: ["host.docker.internal:8761"]
        labels:
          service: eureka-server
      - targets: ["host.docker.internal:8080"]
        labels:
          service: api-gateway
      - targets: ["host.docker.internal:8081", "host.docker.internal:8082", "host.docker.internal:8083"]
        labels:
          service: student-service
      - targets: ["host.docker.internal:8091", "host.docker.internal:8092"]
        labels:
          service: employee-service
      - targets: ["host.docker.internal:8101"]
        labels:
          service: college-service
