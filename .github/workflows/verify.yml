name: Verify Architecture A
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start observability backends
        env:
          GRAFANA_ADMIN_PASSWORD: ci-local-only-password
        run: |
          mkdir -p logs
          chmod 777 logs
          docker compose -f observability/compose.yml up -d
          docker compose -f observability/compose.yml run --rm --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose -f observability/compose.yml run --rm --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - run: mvn -B clean verify
        env:
          OBSERVABILITY_VERIFY: 'true'
      - name: Collect backend logs
        if: always()
        env:
          GRAFANA_ADMIN_PASSWORD: ci-local-only-password
        run: docker compose -f observability/compose.yml logs --no-color > observability-backends.log
      - name: Stop observability backends
        if: always()
        env:
          GRAFANA_ADMIN_PASSWORD: ci-local-only-password
        run: docker compose -f observability/compose.yml down
      - name: Upload test reports and application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-smoke-logs
          path: |
            **/target/surefire-reports/
            integration-tests/target/failsafe-reports/
            integration-tests/target/smoke-logs/
            logs/
            observability-backends.log
