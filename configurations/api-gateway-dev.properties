# dev overrides for api-gateway; add environment-specific settings here.
app.configuration.profile=dev

# Documentation and interactive testing are enabled only in development.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Student Service
springdoc.swagger-ui.urls[0].url=/openapi/students
springdoc.swagger-ui.urls[1].name=Employee Service
springdoc.swagger-ui.urls[1].url=/openapi/employees
springdoc.swagger-ui.urls[2].name=College Service
springdoc.swagger-ui.urls[2].url=/openapi/colleges
spring.cloud.gateway.server.webflux.routes[3].id=student-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/openapi/students
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].id=employee-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=lb://employee-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/openapi/employees
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].id=college-openapi
spring.cloud.gateway.server.webflux.routes[5].uri=lb://college-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/openapi/colleges
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

# Profile lists replace base lists; include business routes as well as documentation routes.
spring.cloud.gateway.server.webflux.routes[0].id=student-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/students/**
spring.cloud.gateway.server.webflux.routes[1].id=employee-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://employee-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/employees/**
spring.cloud.gateway.server.webflux.routes[2].id=college-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://college-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/colleges/**
